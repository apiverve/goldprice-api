openapi: 3.0.4
info:
  title: Gold Price
  description: >-
    Gold Price is a simple tool for getting the current price of gold. It
    returns the current price of gold in any currency and in various units.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/goldprice:
    get:
      summary: Get Current Gold Price
      description: >-
        Get the current price of gold. You can optionally specify a currency
        (defaults to USD).
      operationId: goldprice
      parameters:
        - name: currency
          in: query
          schema:
            type: string
          required: false
          description: The currency to get the price in
          example: USD
        - name: hourly
          in: query
          schema:
            type: boolean
          required: false
          description: Include hourly price data for the past 24 hours
          example: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  currency: USD
                  gram: 152.1
                  kilogram: 152101.49
                  ounce: 4312
                  lastUpdated: '2026-02-07T12:00:00.000Z'
                  change24h: 28.5
                  change24hPct: 0.67
                  changeDirection: up
                  high24h: 4325
                  low24h: 4278.5
                  formatted:
                    ounce: $4,312.00
                    gram: $152.10
                    kilogram: $152,101.49
                    ounceWords: four thousand three hundred twelve dollars
                    kilogramWords: one hundred fifty-two thousand one hundred one dollars
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
